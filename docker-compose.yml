version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: nyotaswerve
      POSTGRES_USER: nyotaswerve
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: "False"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nyotaswerve
      DB_USER: nyotaswerve
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      TALLY_HOST: ${TALLY_HOST:-host.docker.internal}
      TALLY_PORT: 9000
      TALLY_AUTO_SYNC: ${TALLY_AUTO_SYNC:-True}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
      - media_volume:/media

volumes:
  postgres_data:
  static_volume:
  media_volume: